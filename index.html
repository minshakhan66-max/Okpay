<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OKPAY</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #10052e, #19104b, #061b46);
  color: white;
}

.card {
  width: 90%;
  max-width: 380px;
  padding: 28px 22px;
  text-align: center;
  background: #130c37;
  border: 1px solid #6945b8;
  border-radius: 20px;
  box-shadow: 0 8px 30px #0006;
}

.logo {
  width: 100px;
  height: 100px;
  object-fit: contain;
  margin-bottom: 10px;
}

h1 {
  letter-spacing: 3px;
  margin: 8px 0;
}

p {
  color: #c9c2e8;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 14px;
  border: none;
  border-radius: 9px;
  background: #6945b8;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.note {
  margin-top: 18px;
  font-size: 12px;
  color: #aaa1d0;
}
</style>
</head>

<body>
<div class="card">

  <img
    class="logo"
    src="logo.png"
    alt="OKPAY Logo"
    onerror="this.style.display='none'"
  >

  <h1>OKPAY</h1>

  <p>Welcome to OKPAY</p>

  <p>This is a demonstration website.</p>

  <button
    type="button"
    onclick="alert('This is a demo page. No personal information is collected or saved.')"
  >
    CONTINUE
  </button>

  <div class="note">
    Demo page · No personal information is collected.
  </div>

</div>
</body>
</html>
