<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OK PAY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 380px;
      padding: 28px 22px;
      background: #111;
      border: 1px solid #333;
      border-radius: 18px;
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      margin: 0 0 25px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 14px 0;
      border: 1px solid #444;
      border-radius: 9px;
      background: #222;
      color: #fff;
      font-size: 16px;
    }

    input::placeholder {
      color: #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 9px;
      background: #00c853;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 18px;
      color: #aaa;
      font-size: 12px;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>

  <main class="box">

    <img
      src="logo.png"
      alt="OK PAY"
      class="logo"
    >

    <h1>OK PAY</h1>

    <section id="loginScreen">
      <form id="loginForm">

        <input
          type="tel"
          placeholder="Mobile Number"
          maxlength="10"
          inputmode="numeric"
          autocomplete="off"
          required
        >

        <input
          type="password"
          placeholder="Demo Password"
          autocomplete="off"
          required
        >

        <input
          type="password"
          placeholder="6 Digit Demo PIN"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
          required
        >

        <button type="submit">LOGIN</button>

      </form>

      <p class="note">
        Demo only. Do not enter real credentials.
      </p>
    </section>

    <section id="otpScreen" hidden>
      <h2>OTP Verification</h2>

      <p>Demo OTP screen</p>

      <form id="otpForm">

        <input
          type="text"
          placeholder="Enter Demo OTP"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
          required
        >

        <button type="submit">VERIFY</button>

      </form>

      <p id="message" class="note" aria-live="polite"></p>

      <button id="backButton" type="button">
        BACK
      </button>
    </section>

  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const otpForm = document.getElementById("otpForm");
    const loginScreen = document.getElementById("loginScreen");
    const otpScreen = document.getElementById("otpScreen");
    const message = document.getElementById("message");
    const backButton = document.getElementById("backButton");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();

      loginScreen.hidden = true;
      otpScreen.hidden = false;
      message.textContent = "Demo only. No OTP has been sent.";
    });

    otpForm.addEventListener("submit", function(event) {
      event.preventDefault();

      message.textContent =
        "Demo complete. No OTP was verified or saved.";
    });

    backButton.addEventListener("click", function() {
      otpForm.reset();
      loginForm.reset();
      otpScreen.hidden = true;
      loginScreen.hidden = false;
      message.textContent = "";
    });
  </script>

</body>
</html>
