<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OK PAY</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000000;
      color: #ffffff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: #111111;
      border: 1px solid #333333;
      border-radius: 18px;
      padding: 28px 22px;
    }

    .logo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 12px;
    }

    h1 {
      color: #ffffff;
      font-size: 30px;
      margin: 0 0 28px;
      letter-spacing: 2px;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 14px 0;
      border: 1px solid #444444;
      border-radius: 9px;
      background: #222222;
      color: #ffffff;
      font-size: 16px;
      outline: none;
    }

    input::placeholder {
      color: #cccccc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      background: #00c853;
      color: #000000;
      border: none;
      border-radius: 9px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      color: #aaaaaa;
      font-size: 12px;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <img src="logo.png" alt="OK PAY Logo" class="logo">
    <h1>OK PAY</h1>

    <form id="loginForm">
      <input
        type="tel"
        placeholder="Mobile Number"
        maxlength="10"
        autocomplete="off"
        required
      >

      <input
        type="password"
        placeholder="Demo Password"
        autocomplete="off"
        required
      >

      <input
        type="text"
        placeholder="6 Digit Demo PIN"
        inputmode="numeric"
        maxlength="6"
        autocomplete="off"
        required
      >

      <button type="submit">LOGIN</button>
    </form>

    <p class="note">Demo only — do not enter real credentials.</p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Demo only. No information has been saved.");
    });
  </script>
</body>
</html>
