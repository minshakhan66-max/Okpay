<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OKPAY</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: white;
      background: linear-gradient(135deg, #10052e, #19104b, #061b46);
    }

    .box {
      width: 100%;
      max-width: 380px;
      padding: 28px 22px;
      text-align: center;
      border-radius: 22px;
      border: 1px solid #6945b8;
      background: #130c37;
      box-shadow: 0 0 30px rgba(116, 65, 255, 0.22);
    }

    .logo {
      display: block;
      width: 110px;
      height: 110px;
      object-fit: contain;
      margin: 0 auto 15px;
    }

    h1 {
      margin: 0 0 26px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    h2 {
      margin-bottom: 18px;
    }

    input {
      display: block;
      width: 100%;
      padding: 14px;
      margin: 14px 0;
      border: 1px solid #7255c7;
      border-radius: 10px;
      background: #171238;
      color: white;
      font-size: 16px;
    }

    input::placeholder {
      color: #c6bce8;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #843cff, #286bff);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .note {
      margin-top: 18px;
      color: #c5bce5;
      font-size: 12px;
      line-height: 1.5;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <main class="box">

    <img
      src="IMG_20261021_004810_138.jpg"
      alt="OKPAY"
      class="logo"
    >

    <h1>OKPAY</h1>

    <section id="loginScreen">
      <form id="loginForm">
        <input
          type="tel"
          placeholder="Mobile Number"
          inputmode="numeric"
          maxlength="10"
          autocomplete="off"
          required
        >

        <input
          type="password"
          placeholder="Demo Password"
          autocomplete="off"
          required
        >

        <button type="submit">LOGIN</button>
      </form>

      <p class="note">
        Demo only. Do not enter real credentials.
      </p>
    </section>

    <section id="otpScreen" hidden>
      <h2>OTP Verification</h2>

      <p>Demo OTP screen</p>

      <form id="otpForm">
        <input
          type="text"
          placeholder="Enter Demo OTP"
          inputmode="numeric"
          maxlength="6"
          autocomplete="off"
          required
        >

        <button type="submit">VERIFY</button>
      </form>

      <p id="message" class="note" aria-live="polite"></p>

      <button id="backButton" type="button">BACK</button>
    </section>

  </main>

  <script>
    const loginForm = document.getElementById("loginForm");
    const otpForm = document.getElementById("otpForm");
    const loginScreen = document.getElementById("loginScreen");
    const otpScreen = document.getElementById("otpScreen");
    const message = document.getElementById("message");
    const backButton = document.getElementById("backButton");

    loginForm.addEventListener("submit", function(event) {
      event.preventDefault();
      loginScreen.hidden = true;
      otpScreen.hidden = false;
      message.textContent = "Demo only. No OTP was sent.";
    });

    otpForm.addEventListener("submit", function(event) {
      event.preventDefault();
      message.textContent =
        "Demo complete. No OTP was verified or saved.";
    });

    backButton.addEventListener("click", function() {
      loginForm.reset();
      otpForm.reset();
      otpScreen.hidden = true;
      loginScreen.hidden = false;
      message.textContent = "";
    });
  </script>
</body>
</html>
