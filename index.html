<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Login</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }    .box {
        background: white;
        width: 85%;
        max-width: 360px;
        padding: 25px;
        border-radius: 12px;
        box-shadow: 0 4px 15px #ddd;
        text-align: center;
    }

    h2 {
        color: #1769ff;
    }

    input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #1769ff;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
    }
</style>

</head>
<body>
    <div class="box">
        <h2>Login</h2>
        <form onsubmit="event.preventDefault(); alert('Demo only. Login is not connected yet.');">
            <input type="tel" placeholder="Enter mobile number"
                   maxlength="10" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
